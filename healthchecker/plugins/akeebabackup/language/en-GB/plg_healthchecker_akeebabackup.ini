; ── Inline help descriptions ──────────────────────────────────────
; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_AKEEBABACKUP_EXPORT_VISIBILITY_DESC="Controls whether this check appears in exported reports. 'Always export' includes the result regardless of status. 'Issues only' includes it only when Critical or Warning. 'Never export' excludes it from all exports."

PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_INSTALLED_DESC="Verifies that the Akeeba Backup extension is installed on this site. All other checks in this plugin depend on Akeeba Backup being present; if not installed, they will be skipped automatically."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_LAST_BACKUP_DESC="Reports how many days have passed since the last successfully completed backup. Backups older than 7 days are considered a warning; older than 14 days are critical. A site without a recent backup cannot be recovered after a failure."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_SUCCESS_RATE_DESC="Reports the percentage of successful backups out of all attempts in the last 30 days. A low success rate indicates persistent backup failures that need investigation before the next disaster occurs."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_STUCK_BACKUPS_DESC="Detects backup jobs that started more than 24 hours ago and are still marked as running or failed. Stuck backups occupy server resources and indicate a problem with the backup process that must be resolved."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FILES_EXIST_DESC="Verifies that the archive files for completed backups are still present on disk. Missing archive files mean the backup record exists in the database but the actual backup data has been deleted and cannot be used for restoration."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_BACKUP_SIZE_DESC="Reports the total disk space consumed by all stored backup archives. Monitor this value to ensure sufficient storage remains available and to identify unexpectedly large backups that may indicate configuration issues."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_PROFILE_EXISTS_DESC="Checks whether at least one backup profile is configured in Akeeba Backup. Without a profile, no backups can be created. Multiple profiles can be used for different backup types such as full site, database only, or offsite storage."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_PROFILE_CONFIGURED_DESC="Verifies that the default backup profile (ID 1) has been configured and is ready to use. An unconfigured default profile means backups triggered without specifying a profile will use default settings that may not protect the full site."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FAILED_BACKUPS_DESC="Reports the number of backup jobs that failed in the last 30 days. Each failure should be investigated in the Akeeba Backup log to identify the root cause, which may include insufficient memory, disk space, or execution time."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FREQUENCY_DESC="Reports the number of successful backups completed in the last 30 days. Sites that change frequently should be backed up daily; sites with less activity should be backed up at least once a week to minimize potential data loss."
