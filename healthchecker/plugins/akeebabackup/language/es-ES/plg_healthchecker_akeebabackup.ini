; ── Inline help descriptions ──────────────────────────────────────
; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_AKEEBABACKUP_EXPORT_VISIBILITY_DESC="Controla si esta comprobación aparece en los informes exportados. 'Exportar siempre' incluye el resultado sin importar su estado. 'Solo problemas' lo incluye únicamente cuando es Crítico o Advertencia. 'No exportar' lo excluye de todas las exportaciones."

PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_INSTALLED_DESC="Verifica que la extensión Akeeba Backup esté instalada en este sitio. Todas las demás comprobaciones de este plugin dependen de que Akeeba Backup esté presente; si no está instalado, se omitirán automáticamente."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_LAST_BACKUP_DESC="Informa sobre cuántos días han pasado desde la última copia de seguridad completada con éxito. Las copias de más de 7 días se consideran advertencia; más de 14 días son críticas. Un sitio sin una copia de seguridad reciente no puede recuperarse tras un fallo."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_SUCCESS_RATE_DESC="Informa sobre el porcentaje de copias de seguridad exitosas respecto al total de intentos en los últimos 30 días. Una tasa baja indica fallos persistentes que deben investigarse antes de que ocurra un desastre."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_STUCK_BACKUPS_DESC="Detecta trabajos de copia de seguridad que comenzaron hace más de 24 horas y siguen marcados como en ejecución o fallidos. Las copias bloqueadas ocupan recursos del servidor e indican un problema con el proceso de copia que debe resolverse."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FILES_EXIST_DESC="Verifica que los archivos de las copias de seguridad completadas estén presentes en el disco. Los archivos faltantes significan que el registro existe en la base de datos pero los datos reales han sido eliminados y no pueden usarse para restaurar el sitio."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_BACKUP_SIZE_DESC="Informa sobre el espacio en disco total consumido por todos los archivos de copia de seguridad almacenados. Conviene monitorear este valor para asegurarse de que queda espacio de almacenamiento suficiente e identificar copias inesperadamente grandes que pueden indicar problemas de configuración."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_PROFILE_EXISTS_DESC="Comprueba si hay al menos un perfil de copia de seguridad configurado en Akeeba Backup. Sin un perfil no se pueden crear copias de seguridad. Se pueden usar múltiples perfiles para distintos tipos de copia, como sitio completo, solo base de datos o almacenamiento externo."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_PROFILE_CONFIGURED_DESC="Verifica que el perfil de copia de seguridad predeterminado (ID 1) esté configurado y listo para usar. Un perfil predeterminado no configurado significa que las copias iniciadas sin especificar un perfil usarán ajustes por defecto que pueden no proteger el sitio completo."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FAILED_BACKUPS_DESC="Informa sobre el número de trabajos de copia de seguridad que fallaron en los últimos 30 días. Cada fallo debe investigarse en el registro de Akeeba Backup para identificar la causa raíz, que puede incluir memoria insuficiente, espacio en disco o tiempo de ejecución."
PLG_HEALTHCHECKER_AKEEBABACKUP_CHECK_AKEEBA_BACKUP_FREQUENCY_DESC="Informa sobre el número de copias de seguridad exitosas completadas en los últimos 30 días. Los sitios que cambian frecuentemente deben respaldarse a diario; los de menor actividad al menos una vez por semana para minimizar la posible pérdida de datos."
