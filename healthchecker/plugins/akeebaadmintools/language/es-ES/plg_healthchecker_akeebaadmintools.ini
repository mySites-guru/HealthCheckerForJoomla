; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_EXPORT_VISIBILITY_DESC="Controla si esta comprobación aparece en los informes exportados. 'Exportar siempre' incluye el resultado sin importar su estado. 'Solo problemas' lo incluye únicamente cuando es Crítico o Advertencia. 'No exportar' lo excluye de todas las exportaciones."

PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_INSTALLED_DESC="Verifica que la extensión Akeeba Admin Tools esté instalada en este sitio. Todas las demás comprobaciones de este plugin dependen de que Admin Tools esté presente; si no está instalado, se omitirán automáticamente."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_WAF_ENABLED_DESC="Comprueba cuántas reglas del Firewall de Aplicaciones Web (WAF) están activas en Admin Tools. El WAF filtra las solicitudes maliciosas antes de que lleguen a Joomla!; deshabilitar reglas reduce la protección del sitio frente a patrones de ataque conocidos."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SECURITY_EVENTS_DESC="Informa sobre el número de eventos de seguridad registrados por Admin Tools en los últimos 7 días. Un aumento repentino de eventos puede indicar un ataque activo o un intento de escaneo automatizado contra el sitio."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_BLOCKED_ATTACKS_DESC="Informa sobre el número de intentos de ataque bloqueados por el WAF en las últimas 24 horas. Este conteo incluye las solicitudes rechazadas automáticamente según las reglas del WAF, como intentos de inyección SQL o recorrido de rutas."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_ACTIVE_BANS_DESC="Informa sobre el número de direcciones IP actualmente bloqueadas por Admin Tools. Los bloqueos se aplican automáticamente cuando una IP supera el umbral de ataques configurado o se añade manualmente a la lista de bloqueo."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SCAN_AGE_DESC="Informa sobre cuántos días han pasado desde que se completó el último análisis de integridad de archivos de Admin Tools. El análisis de integridad detecta modificaciones no autorizadas en los archivos del núcleo que pueden indicar un compromiso. Los análisis deben ejecutarse al menos semanalmente."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_FILE_ALERTS_DESC="Informa sobre las alertas de integridad de archivos que aún no han sido revisadas. Estas alertas indican que Admin Tools detectó cambios en los archivos monitoreados. Cada alerta debe revisarse para determinar si el cambio fue autorizado o es resultado de un acceso no autorizado."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_TEMP_SUPERUSERS_DESC="Comprueba si hay registros vencidos de superusuarios temporales creados por Admin Tools. Los registros vencidos deben limpiarse para evitar confusiones; los superusuarios temporales cuyo período de acceso ha finalizado ya no deben tener privilegios elevados."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_IP_WHITELIST_DESC="Informa sobre el número de direcciones IP en la lista blanca de Admin Tools. Las IP en lista blanca omiten por completo las reglas del WAF. Se debe revisar esta lista periódicamente para asegurarse de que solo se incluyen IP de confianza, ya que una lista desactualizada puede crear brechas de seguridad."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_WAF_RULES_DESC="Informa sobre cuántas de las reglas WAF disponibles están actualmente habilitadas. Deshabilitar reglas WAF reduce la protección de la superficie de ataque. Se deben revisar las reglas deshabilitadas para confirmar que fueron desactivadas intencionalmente y no son necesarias para este sitio."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_LOGIN_FAILURES_DESC="Informa sobre el número de intentos de inicio de sesión fallidos registrados por Admin Tools en las últimas 24 horas. Un número alto puede indicar un ataque de fuerza bruta dirigido al acceso del administrador. Se recomienda habilitar el bloqueo automático de IP si no está ya activo."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_GEOBLOCKING_DESC="Informa sobre el número de solicitudes bloqueadas por el bloqueo geográfico de Admin Tools en los últimos 7 días. El bloqueo geográfico rechaza el tráfico de países que no se espera que accedan al sitio, reduciendo la exposición a ataques internacionales."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SQLI_BLOCKS_DESC="Informa sobre el número de intentos de inyección SQL bloqueados por el WAF en los últimos 7 días. La inyección SQL es uno de los vectores de ataque web más comunes; un número alto indica que el sitio está siendo sondeado activamente."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_XSS_BLOCKS_DESC="Informa sobre el número de intentos de Cross-Site Scripting (XSS) bloqueados por el WAF en los últimos 7 días. Los ataques XSS intentan inyectar scripts maliciosos en páginas web vistas por otros usuarios, pudiendo robar tokens de sesión o redirigir a los visitantes."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_ADMIN_ACCESS_DESC="Informa sobre el número de intentos de acceso al directorio /administrator registrados por Admin Tools en los últimos 7 días. Un número alto puede indicar bots automatizados o ataques dirigidos que intentan acceder a la página de inicio de sesión del panel de administración."
