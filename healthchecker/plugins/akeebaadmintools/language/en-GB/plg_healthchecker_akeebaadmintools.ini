; ── Inline help descriptions ──────────────────────────────────────

; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_EXPORT_VISIBILITY_DESC="Controls whether this check appears in exported reports. 'Always export' includes the result regardless of status. 'Issues only' includes it only when Critical or Warning. 'Never export' excludes it from all exports."

PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_INSTALLED_DESC="Verifies that the Akeeba Admin Tools extension is installed on this site. All other checks in this plugin depend on Admin Tools being present; if not installed, they will be skipped automatically."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_WAF_ENABLED_DESC="Checks how many Web Application Firewall (WAF) rules are active in Admin Tools. The WAF filters malicious requests before they reach Joomla; disabling rules reduces your site's protection against known attack patterns."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SECURITY_EVENTS_DESC="Reports the number of security events logged by Admin Tools in the last 7 days. A sudden spike in events may indicate an active attack or an automated scanning attempt against the site."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_BLOCKED_ATTACKS_DESC="Reports the number of attack attempts blocked by the WAF in the last 24 hours. This count includes requests that were automatically rejected based on WAF rules, such as SQL injection or path traversal attempts."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_ACTIVE_BANS_DESC="Reports the number of IP addresses currently banned by Admin Tools. Bans are applied automatically when an IP exceeds the configured attack threshold or is manually added to the block list."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SCAN_AGE_DESC="Reports how many days ago the last Admin Tools file integrity scan was completed. File integrity scanning detects unauthorized modifications to core files that may indicate a compromise. Scans should run at least weekly."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_FILE_ALERTS_DESC="Reports file integrity alerts that have not yet been acknowledged. These alerts indicate that Admin Tools detected changes in monitored files. Each alert should be reviewed to determine whether the change was authorized or is the result of unauthorized access."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_TEMP_SUPERUSERS_DESC="Checks for expired temporary Super User records created by Admin Tools. Expired records should be cleaned up to avoid confusion; temporary super users whose grant period has ended should no longer have elevated access."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_IP_WHITELIST_DESC="Reports the number of IP addresses in the Admin Tools whitelist. Whitelisted IPs bypass WAF rules entirely. Regularly review this list to ensure only trusted IP addresses are included, as an outdated whitelist can create security gaps."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_WAF_RULES_DESC="Reports how many of the available WAF rules are currently enabled. Disabling WAF rules reduces the attack surface protection. Review any disabled rules to confirm they were intentionally turned off and are not needed for this site."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_LOGIN_FAILURES_DESC="Reports the number of failed login attempts recorded by Admin Tools in the last 24 hours. A high count may indicate a brute force attack targeting the administrator login. Consider enabling automatic IP banning if not already active."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_GEOBLOCKING_DESC="Reports the number of requests blocked by Admin Tools geoblocking in the last 7 days. Geoblocking rejects traffic from countries that are not expected to access the site, reducing exposure to international attacks."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_SQLI_BLOCKS_DESC="Reports the number of SQL injection attempts blocked by the WAF in the last 7 days. SQL injection is one of the most common web attack vectors; a high count indicates that the site is being actively probed."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_XSS_BLOCKS_DESC="Reports the number of Cross-Site Scripting (XSS) attempts blocked by the WAF in the last 7 days. XSS attacks attempt to inject malicious scripts into web pages viewed by other users, potentially stealing session tokens or redirecting visitors."
PLG_HEALTHCHECKER_AKEEBAADMINTOOLS_CHECK_AKEEBA_ADMINTOOLS_ADMIN_ACCESS_DESC="Reports the number of attempts to access the /administrator directory recorded by Admin Tools in the last 7 days. A high count may indicate automated bots or targeted attacks trying to reach the backend login page."
