; Descripciones de comprobaciones - Configuración personalizada
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_CUSTOM_CONFIG_GOOD="<p><strong>[COMPROBACIÓN DE EJEMPLO]</strong> <code>%s</code> extensiones instaladas.</p><p>Esta es una <em>demostración</em> del plugin Example Provider que muestra compatibilidad con formato HTML:</p><ul><li>Texto en <strong>negrita</strong> y <em>cursiva</em></li><li>Formato de <code>código</code> en línea</li><li>Listas para varios elementos</li></ul><p>Bloques de código con <code>&lt;pre&gt;</code>:</p><pre>php bin/console cache:clear</pre><p>Para ocultar esto, deshabilite el plugin <strong>Health Checker - Example Provider</strong>.</p>"
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_CUSTOM_CONFIG_WARNING="<p><strong>[COMPROBACIÓN DE EJEMPLO]</strong> Tiene <code>%s</code> extensiones instaladas.</p><p>Esta es una <em>advertencia de demostración</em> del plugin Example Provider que muestra formato HTML:</p><ul><li>Texto en negrita con <code>&lt;strong&gt;</code></li><li>Código en línea con <code>&lt;code&gt;</code></li><li>Listas con <code>&lt;ul&gt;</code> y <code>&lt;li&gt;</code></li></ul><p>Bloques de código con <code>&lt;pre&gt;</code>:</p><pre>php bin/console extension:list</pre><p>Para ocultar esto, deshabilite el plugin <strong>Health Checker - Example Provider</strong> en Extensiones → Plugins.</p>"

; Descripciones de comprobaciones - Servicio de terceros
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_THIRDPARTY_SERVICE_GOOD="[COMPROBACIÓN DE EJEMPLO] El servicio API de Joomla! es accesible y responde con normalidad. Para ocultar esto, deshabilite el plugin &quot;Health Checker - Example Provider&quot; en Extensiones → Plugins."
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_THIRDPARTY_SERVICE_WARNING="[COMPROBACIÓN DE EJEMPLO] El servicio API de Joomla! es accesible, pero responde lentamente. Para ocultar esto, deshabilite el plugin &quot;Health Checker - Example Provider&quot; en Extensiones → Plugins."
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_THIRDPARTY_SERVICE_CRITICAL="[COMPROBACIÓN DE EJEMPLO] No se puede acceder al servicio API de Joomla! Revise la conexión a Internet o la configuración del firewall. Para ocultar esto, deshabilite el plugin &quot;Health Checker - Example Provider&quot; en Extensiones → Plugins."

; ── Pestaña Guía de desarrollador ───────────────────────────────────────────
PLG_HEALTHCHECKER_EXAMPLE_TAB_GUIDE_LABEL="Guía de desarrollo"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_INTRO="<p>Este plugin es una plantilla lista para usar al crear plugins personalizados para Health Checker. Se debe copiar, actualizar el espacio de nombres y los nombres de clase, implementar las comprobaciones e instalar.</p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_EVENTS_LABEL="Cómo funciona el autodescubrimiento"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_EVENTS_DESC="<p>Health Checker despacha tres eventos en secuencia. El plugin se suscribe a ellos mediante <code>getSubscribedEvents()</code>:</p><ol><li><strong>onHealthCheckerCollectProviders</strong> — registrar la identidad del plugin (slug, nombre, URL, icono)</li><li><strong>onHealthCheckerCollectCategories</strong> — registrar categorías de comprobación personalizadas (opcional)</li><li><strong>onHealthCheckerCollectChecks</strong> — registrar las instancias de las clases de comprobación</li></ol><p>No se necesita configuración manual. Basta con instalar y habilitar el plugin.</p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_STEPS_LABEL="Inicio rápido"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_STEPS_DESC="<ol><li>Copiar la carpeta de este plugin y renombrarla (<code>plg_healthchecker_miplugin</code>)</li><li>Actualizar la etiqueta <code>&lt;n&gt;</code> y <code>&lt;namespace&gt;</code> en el manifiesto XML</li><li>Reemplazar todas las ocurrencias de <code>MySitesGuru\HealthChecker\Plugin\Example</code> por el espacio de nombres propio</li><li>Implementar <code>onCollectProviders()</code> con un slug único</li><li>Crear las clases de comprobación extendiendo <code>AbstractHealthCheck</code></li><li>Registrarlas en <code>onCollectChecks()</code></li><li>Añadir claves de idioma para títulos, mensajes de resultado y ayuda interna</li><li>Comprimir e instalar mediante Extensiones → Instalar</li></ol>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_CATEGORIES_LABEL="Categorías principales disponibles"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_CATEGORIES_DESC="<p>Se puede usar cualquiera de estos slugs de categoría existentes en <code>getCategory()</code>, o registrar una propia en <code>onCollectCategories()</code>:</p><p><code>system</code> · <code>database</code> · <code>security</code> · <code>users</code> · <code>extensions</code> · <code>performance</code> · <code>seo</code> · <code>content</code></p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_DOCS_LABEL="Documentación oficial"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_DOCS_DESC="<ul><li><a href='https://manual.joomla.org/' target='_blank'>Manual para programadores de Joomla</a> — referencia oficial para desarrolladores J5/J6</li><li><a href='https://manual.joomla.org/docs/4.4/building-extensions/plugins/basic-content-plugin/' target='_blank'>Tutorial de plugins</a> — crear un plugin desde cero</li><li><a href='https://manual.joomla.org/docs/next/building-extensions/plugins/methods-and-arguments/' target='_blank'>Métodos y SubscriberInterface</a> — patrones de suscripción a eventos</li><li><a href='https://manual.joomla.org/docs/4.4/building-extensions/plugins/joomla-4-and-5-changes/' target='_blank'>Cambios de Joomla 4 a 5 en plugins</a> — guía de migración</li><li><a href='https://manual.joomla.org/docs/4.4/general-concepts/dependency-injection/' target='_blank'>Inyección de dependencias</a> — explicación de services/provider.php</li><li><a href='https://github.com/mySites-guru/HealthCheckerForJoomla' target='_blank'>Health Checker en GitHub</a> — código fuente e incidencias</li><li><a href='https://github.com/mySites-guru/HealthCheckerForJoomla/tree/main/healthchecker/plugins/example' target='_blank'>Código fuente de este plugin de ejemplo</a> — código de referencia anotado</li></ul>"
