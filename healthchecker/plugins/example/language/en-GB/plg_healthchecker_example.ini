PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_CUSTOM_CONFIG_GOOD="<p><strong>[EXAMPLE CHECK]</strong> <code>%s</code> extensions installed.</p><p>This is a <em>demonstration</em> from the Example Provider plugin showing HTML formatting support:</p><ul><li><strong>Bold</strong> and <em>italic</em> text</li><li>Inline <code>code</code> formatting</li><li>Lists for multiple items</li></ul><p>Code blocks with <code>&lt;pre&gt;</code>:</p><pre>php bin/console cache:clear</pre><p>To hide this, disable the <strong>Health Checker - Example Provider</strong> plugin.</p>"
PLG_HEALTHCHECKER_EXAMPLE_CHECK_EXAMPLE_CUSTOM_CONFIG_WARNING="<p><strong>[EXAMPLE CHECK]</strong> You have <code>%s</code> extensions installed.</p><p>This is a <em>demonstration warning</em> from the Example Provider plugin showing HTML formatting:</p><ul><li>Bold text with <code>&lt;strong&gt;</code></li><li>Inline code with <code>&lt;code&gt;</code></li><li>Lists with <code>&lt;ul&gt;</code> and <code>&lt;li&gt;</code></li></ul><p>Code blocks with <code>&lt;pre&gt;</code>:</p><pre>php bin/console extension:list</pre><p>To hide this, disable the <strong>Health Checker - Example Provider</strong> plugin in Extensions → Plugins.</p>"

