; ── Developer Guide Tab ─────────────────────────────────────────────────────
PLG_HEALTHCHECKER_EXAMPLE_TAB_GUIDE_LABEL="Developer Guide"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_INTRO="<p>This plugin is a ready-to-use template for creating custom Health Checker plugins. Copy it, update the namespace and class names, implement your checks, and install.</p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_EVENTS_LABEL="How auto-discovery works"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_EVENTS_DESC="<p>Health Checker dispatches three events in sequence. Your plugin subscribes to them via <code>getSubscribedEvents()</code>:</p><ol><li><strong>onHealthCheckerCollectProviders</strong> — register your plugin identity (slug, name, URL, icon)</li><li><strong>onHealthCheckerCollectCategories</strong> — register custom check categories (optional)</li><li><strong>onHealthCheckerCollectChecks</strong> — register your check class instances</li></ol><p>No manual configuration is needed. Installing and enabling the plugin is enough.</p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_STEPS_LABEL="Quick start"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_STEPS_DESC="<ol><li>Copy this plugin folder and rename it (<code>plg_healthchecker_yourplugin</code>)</li><li>Update the <code>&lt;n&gt;</code> tag and <code>&lt;namespace&gt;</code> in the XML manifest</li><li>Replace every occurrence of <code>MySitesGuru\HealthChecker\Plugin\Example</code> with your namespace</li><li>Implement <code>onCollectProviders()</code> with a unique slug</li><li>Create your check classes extending <code>AbstractHealthCheck</code></li><li>Register them in <code>onCollectChecks()</code></li><li>Add language keys for titles, result messages, and inline help</li><li>Zip and install via Extensions → Install</li></ol>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_CATEGORIES_LABEL="Available core categories"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_CATEGORIES_DESC="<p>Use any of these existing category slugs in <code>getCategory()</code>, or register your own in <code>onCollectCategories()</code>:</p><p><code>system</code> · <code>database</code> · <code>security</code> · <code>users</code> · <code>extensions</code> · <code>performance</code> · <code>seo</code> · <code>content</code></p>"

PLG_HEALTHCHECKER_EXAMPLE_GUIDE_DOCS_LABEL="Official documentation"
PLG_HEALTHCHECKER_EXAMPLE_GUIDE_DOCS_DESC="<ul><li><a href='https://manual.joomla.org/' target='_blank'>Joomla Programmers Manual</a> — official J5/J6 developer reference</li><li><a href='https://manual.joomla.org/docs/4.4/building-extensions/plugins/basic-content-plugin/' target='_blank'>Plugin Tutorial</a> — build a plugin from scratch</li><li><a href='https://manual.joomla.org/docs/next/building-extensions/plugins/methods-and-arguments/' target='_blank'>Plugin Methods &amp; SubscriberInterface</a> — event subscription patterns</li><li><a href='https://manual.joomla.org/docs/4.4/building-extensions/plugins/joomla-4-and-5-changes/' target='_blank'>Joomla 4 → 5 plugin changes</a> — migration guide</li><li><a href='https://manual.joomla.org/docs/4.4/general-concepts/dependency-injection/' target='_blank'>Dependency Injection</a> — services/provider.php explained</li><li><a href='https://github.com/mySites-guru/HealthCheckerForJoomla' target='_blank'>Health Checker on GitHub</a> — source code and issues</li><li><a href='https://github.com/mySites-guru/HealthCheckerForJoomla/tree/main/healthchecker/plugins/example' target='_blank'>This example plugin source</a> — annotated reference code</li></ul>"
