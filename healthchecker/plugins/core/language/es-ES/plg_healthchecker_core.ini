; ── Inline help descriptions ──────────────────────────────────────
; Campo de exportación — descripción compartida usada en todos los desplegables de exportación
PLG_HEALTHCHECKER_CORE_EXPORT_VISIBILITY_DESC="Controla si esta comprobación aparece en los informes exportados. 'Exportar siempre' incluye el resultado sin importar su estado. 'Solo problemas' lo incluye únicamente cuando es Crítico o Advertencia. 'No exportar' lo excluye de todas las exportaciones."

; SYSTEM
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_VERSION_DESC="Verifica que la versión de PHP cumpla los requisitos de Joomla! 5+. Una versión de PHP desactualizada puede causar problemas de compatibilidad y vulnerabilidades de seguridad."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_EOL_DESC="Comprueba si la versión de PHP instalada está dentro de su ciclo de vida de soporte activo. Las versiones de PHP en fin de vida ya no reciben parches de seguridad."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_SAPI_DESC="Identifica el tipo de interfaz de servidor PHP (SAPI) en uso. Se recomienda PHP-FPM para obtener mejor rendimiento y aislamiento en entornos de producción."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MEMORY_LIMIT_DESC="Verifica que el parámetro memory_limit de PHP sea suficiente para Joomla! Un límite de memoria bajo puede causar errores durante la instalación de extensiones o el renderizado de páginas complejas."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_EXECUTION_TIME_DESC="Comprueba el tiempo máximo en segundos que un script PHP puede ejecutarse. Un valor demasiado bajo puede causar timeouts durante copias de seguridad o importaciones de datos grandes."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_INPUT_TIME_DESC="Comprueba el tiempo máximo que PHP espera para recibir datos de entrada. Un valor bajo puede causar problemas al subir archivos grandes o enviar formularios complejos."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_INPUT_VARS_DESC="Verifica el número máximo de variables de entrada que PHP acepta por solicitud. Un valor bajo puede causar pérdida de datos en formularios con muchos campos, como menús o configuraciones de ACL."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_POST_MAX_SIZE_DESC="Comprueba el tamaño máximo de los datos POST que PHP aceptará. Este valor debe ser mayor que upload_max_filesize para que las cargas de archivos funcionen correctamente."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_UPLOAD_MAX_FILESIZE_DESC="Verifica el tamaño máximo de archivo permitido para las cargas. Un valor bajo impide subir paquetes de extensiones grandes, imágenes o archivos multimedia."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OUTPUT_BUFFERING_DESC="Comprueba si el búfer de salida de PHP está habilitado. Cuando está activado puede interferir con la gestión de cabeceras de Joomla! y causar problemas de salida inesperados."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_JSON_EXTENSION_DESC="Verifica que la extensión JSON de PHP esté cargada. Esta extensión es obligatoria para que Joomla! procese respuestas de API, archivos de configuración e intercambio de datos."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SIMPLEXML_EXTENSION_DESC="Verifica que la extensión SimpleXML de PHP esté cargada. Joomla! usa SimpleXML para leer los manifiestos de extensiones (archivos .xml) durante la instalación."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_DOM_EXTENSION_DESC="Verifica que la extensión DOM de PHP esté cargada. Es obligatoria para que Joomla! procese XML, manipule HTML y realice diversas operaciones del núcleo."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PDO_MYSQL_EXTENSION_DESC="Verifica que la extensión PDO MySQL de PHP esté cargada. Es el controlador de base de datos que Joomla! utiliza para comunicarse con MySQL y MariaDB."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_GD_OR_IMAGICK_DESC="Comprueba si las extensiones de procesamiento de imágenes GD o Imagick están disponibles. Al menos una es obligatoria para redimensionar imágenes, generar miniaturas y renderizar CAPTCHA."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_ZIP_EXTENSION_DESC="Verifica que la extensión Zip de PHP esté cargada. Es obligatoria para instalar y actualizar extensiones de Joomla!, que se distribuyen como archivos .zip."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MBSTRING_EXTENSION_DESC="Verifica que la extensión Mbstring de PHP esté cargada. Es obligatoria para el manejo correcto de caracteres multibyte (UTF-8), esencial en sitios multilingüe."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_INTL_EXTENSION_DESC="Comprueba si la extensión Intl de PHP está cargada. Joomla! la usa para operaciones de cadenas con localización, formato de fechas y formato de números."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_CORE_DIRECTORIES_DESC="Verifica que los directorios críticos de Joomla! como /tmp, /logs y /cache existan y sean accesibles. Los directorios faltantes pueden hacer que Joomla! funcione incorrectamente."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_CURL_EXTENSION_DESC="Comprueba si la extensión cURL de PHP está cargada. Se usa para solicitudes HTTP remotas, incluyendo la comprobación de actualizaciones de extensiones e integraciones con API externas."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OPENSSL_EXTENSION_DESC="Verifica que la extensión OpenSSL de PHP esté cargada. Es obligatoria para conexiones HTTPS, correo cifrado mediante SMTP TLS/SSL y operaciones criptográficas."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_FILEINFO_EXTENSION_DESC="Comprueba si la extensión Fileinfo de PHP está cargada. Se usa para detectar el tipo MIME al subir archivos a través del Gestor multimedia."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_DISK_SPACE_DESC="Comprueba el espacio en disco disponible en el servidor. Un espacio en disco críticamente bajo puede impedir que Joomla! escriba archivos temporales, registros o contenido en caché."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_TEMP_DIRECTORY_DESC="Verifica que el directorio temporal de Joomla! exista y tenga permisos de escritura. El directorio temporal se usa durante la instalación de extensiones y las actualizaciones del núcleo."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SERVER_TIME_DESC="Comprueba que el reloj del servidor esté sincronizado con una fuente horaria externa. Un reloj desajustado puede causar problemas con el vencimiento de sesiones, tareas programadas y certificados SSL."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OPCACHE_DESC="Comprueba si PHP OPcache está habilitado y en buen estado. OPcache mejora significativamente el rendimiento de PHP al almacenar el bytecode precompilado de los scripts en memoria."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_REALPATH_CACHE_DESC="Verifica que la caché de rutas reales (realpath cache) de PHP tenga un tamaño adecuado. Una caché demasiado pequeña obliga a PHP a resolver las rutas de archivos en cada solicitud, reduciendo el rendimiento."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OVERDUE_TASKS_DESC="Comprueba si hay tareas programadas que han superado su hora de ejecución sin ejecutarse. Las tareas vencidas pueden indicar un programador de tareas (cron) mal configurado o detenido."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_FAILED_TASKS_DESC="Comprueba si hay tareas programadas que hayan fallado durante su ejecución. Las tareas fallidas deben revisarse en el programador de tareas para identificar y resolver la causa subyacente."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SESSION_SAVE_PATH_DESC="Verifica que la ruta de guardado de sesiones de PHP exista y tenga permisos de escritura. Una ruta inaccesible impide que los usuarios inicien sesión o mantengan su sesión activa."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAIL_FUNCTION_DESC="Comprueba si el método de correo configurado (PHP mail, SMTP o Sendmail) está disponible y funciona correctamente. Una configuración de correo incorrecta impide que Joomla! envíe correos electrónicos."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_EXIF_EXTENSION_DESC="Comprueba si la extensión EXIF de PHP está cargada. Se usa para leer los metadatos incluidos en archivos de imagen, como información de la cámara, coordenadas GPS y orientación."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_IMAGICK_VERSION_DESC="Comprueba la versión de la extensión Imagick si está instalada. Una versión desactualizada puede tener vulnerabilidades de seguridad o carecer de soporte para formatos de imagen modernos."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_LOG_FILE_SIZE_DESC="Comprueba el tamaño total del directorio de registros de Joomla! Un directorio excesivamente grande puede indicar errores que generan entradas excesivas o la necesidad de rotar los registros."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_APACHE_MODULES_DESC="Comprueba si los módulos de Apache necesarios como mod_rewrite y mod_expires están disponibles. Los módulos faltantes pueden impedir el funcionamiento de las URL SEF, la caché del navegador y otras funciones."
; DATABASE
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_CONNECTION_DESC="Verifica que Joomla! pueda conectarse correctamente a su base de datos configurada. Una conexión fallida hace que todo el sitio sea inaccesible."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SERVER_VERSION_DESC="Comprueba que la versión del servidor de base de datos cumpla los requisitos de Joomla! 5+. Se recomiendan MySQL 8.0 o MariaDB 10.4 o superior para plena compatibilidad."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_USER_PRIVILEGES_DESC="Verifica que el usuario de la base de datos tenga todos los privilegios necesarios como SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX y ALTER. Los privilegios faltantes pueden hacer que la instalación de extensiones falle."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_CONNECTION_CHARSET_DESC="Comprueba que la conexión a la base de datos use el juego de caracteres utf8mb4. Esto garantiza compatibilidad completa con Unicode, incluyendo emojis y caracteres especiales de todos los idiomas."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_ENGINE_DESC="Verifica que todas las tablas de Joomla! usen el motor de almacenamiento InnoDB. InnoDB soporta transacciones, claves foráneas y bloqueo a nivel de fila, esenciales para la integridad de los datos."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_CHARSET_DESC="Comprueba que todas las tablas de Joomla! usen cotejamiento utf8mb4. Un cotejamiento inconsistente puede causar problemas de codificación de caracteres y errores de comparación en las consultas."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_STATUS_DESC="Comprueba la integridad de todas las tablas de la base de datos de Joomla! Las tablas dañadas pueden causar pérdida de datos, errores en las consultas e inestabilidad del sitio."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_AUTO_INCREMENT_DESC="Comprueba que los contadores de auto-incremento en las tablas principales tengan margen suficiente antes de alcanzar su valor máximo. Los contadores agotados impiden la creación de nuevos registros."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_ORPHANED_TABLES_DESC="Detecta tablas de la base de datos con el prefijo del sitio que no están registradas como pertenecientes a ninguna extensión instalada. Pueden ser residuos de extensiones que no se desinstalaron correctamente."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SQL_MODE_DESC="Comprueba el modo SQL configurado en el servidor de base de datos. Ciertos modos estrictos como ONLY_FULL_GROUP_BY pueden causar problemas de compatibilidad con algunas extensiones de Joomla!"
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_MAX_PACKET_DESC="Comprueba el parámetro max_allowed_packet de la base de datos. Un valor bajo puede impedir guardar contenido extenso, causando truncamiento silencioso de datos o errores en las consultas."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_WAIT_TIMEOUT_DESC="Comprueba el parámetro wait_timeout de la base de datos. Un valor muy bajo puede causar timeouts durante operaciones largas; un valor muy alto desperdicia recursos del servidor."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_PREFIX_DESC="Verifica que esté configurado un prefijo de tabla de base de datos personalizado. Usar el prefijo predeterminado 'jos_' es un riesgo de seguridad menor, ya que es predecible en intentos de inyección SQL."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_INDEX_USAGE_DESC="Comprueba que todas las tablas de Joomla! tengan definidas claves primarias e índices. Las tablas sin índices sufren una grave degradación del rendimiento a medida que crecen los datos."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SIZE_DESC="Informa sobre el tamaño total de la base de datos. Una base de datos que crece rápidamente puede requerir archivar contenido antiguo u optimizar el almacenamiento de las tablas."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SLOW_QUERY_DESC="Comprueba si el registro de consultas lentas de MySQL está habilitado. Aunque es útil para depuración, debe deshabilitarse en producción, ya que añade sobrecarga a cada consulta de la base de datos."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TRANSACTION_ISOLATION_DESC="Comprueba el nivel de aislamiento de transacciones de la base de datos. El nivel REPEATABLE-READ es el recomendado para la mayoría de instalaciones de Joomla! ya que equilibra consistencia y rendimiento."
; SECURITY
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_DEBUG_MODE_DESC="Comprueba si el modo de depuración de Joomla! está habilitado. El modo de depuración siempre debe estar deshabilitado en producción, ya que expone mensajes de error detallados e información del sistema a los visitantes."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ERROR_REPORTING_DESC="Comprueba el nivel de informe de errores de PHP configurado en Joomla! El informe máximo de errores solo debe usarse durante el desarrollo; los sitios en producción deben usar Ninguno o Simple."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_FORCE_SSL_DESC="Comprueba si Joomla! está configurado para forzar conexiones HTTPS. Forzar SSL garantiza que todo el tráfico, incluyendo las credenciales de acceso, esté cifrado en tránsito."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_SESSION_HANDLER_DESC="Comprueba el método de almacenamiento de sesiones configurado en Joomla! Se recomiendan las sesiones en base de datos en hosting compartido, ya que son más seguras que las sesiones en sistema de archivos."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_DEFAULT_SECRET_DESC="Verifica que la clave secreta de Joomla! esté configurada, sea única y tenga una longitud suficiente. La clave secreta se usa en operaciones criptográficas; una clave débil o predeterminada es un riesgo crítico de seguridad."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_HTACCESS_PROTECTION_DESC="Comprueba si hay un archivo .htaccess presente y configurado en servidores Apache. Un archivo .htaccess ausente o vacío deshabilita la reescritura de URL y protecciones de seguridad importantes."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_INDEX_FILE_DESC="Comprueba si hay archivos index.html o index.php de marcador de posición en la raíz del sitio. Estos archivos pueden servirse a los visitantes o ser indexados por los motores de búsqueda de forma no intencionada."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CONFIGURATION_PHP_PERMISSIONS_DESC="Verifica los permisos del archivo configuration.php. Los permisos de lectura o escritura para todos pueden exponer las credenciales de la base de datos y configuraciones sensibles a accesos no autorizados."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_TWO_FACTOR_AUTH_DESC="Comprueba si la autenticación multifactor está habilitada y configurada en las cuentas de superadministrador. Reduce significativamente el riesgo de acceso no autorizado al área de administración."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_SESSION_LIFETIME_DESC="Comprueba la duración de la sesión configurada en minutos. Una duración excesivamente larga aumenta el riesgo de secuestro de sesión; una muy corta provoca cierres de sesión frecuentes."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ACTION_LOGS_ENABLED_DESC="Comprueba si el plugin Sistema - Registros de acciones está habilitado. Los registros de acciones registran la actividad del administrador, esencial para la auditoría de seguridad y el seguimiento de cambios no autorizados."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_MAILER_SECURITY_DESC="Comprueba la configuración de seguridad del sistema de correo de Joomla! Se recomienda SMTP con cifrado TLS o SSL para evitar que las credenciales de correo se transmitan en texto plano."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_RECAPTCHA_DESC="Comprueba si hay un plugin CAPTCHA habilitado y configurado como predeterminado. El CAPTCHA es esencial para prevenir envíos automáticos de spam a través de formularios y páginas de registro."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_API_AUTH_DESC="Comprueba qué plugins de autenticación de API están habilitados. Sin un plugin de autenticación, la API de servicios web de Joomla! es inaccesible para todos los clientes, incluidos los autorizados."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_PRIVACY_DASHBOARD_DESC="Comprueba si el componente de Privacidad está habilitado y si hay solicitudes de privacidad pendientes. El componente de Privacidad es necesario para las funciones de cumplimiento del RGPD."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ADMIN_PATH_DESC="Comprueba si la ruta del administrador ha sido personalizada respecto al valor predeterminado /administrator. Una ruta de administración predecible facilita que los bots automatizados apunten a la página de inicio de sesión."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_PASSWORD_POLICY_DESC="Comprueba la longitud mínima de contraseña y los requisitos de complejidad. Una política de contraseñas débil aumenta el riesgo de compromiso de cuentas mediante ataques de fuerza bruta o de diccionario."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_BRUTE_FORCE_PROTECTION_DESC="Comprueba si hay protección contra fuerza bruta habilitada para el formulario de inicio de sesión. Sin protección, las herramientas automatizadas pueden intentar combinaciones de acceso ilimitadas contra el sitio."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CORS_DESC="Comprueba la configuración de Intercambio de Recursos de Origen Cruzado (CORS). Una política CORS con comodín permite que cualquier sitio externo realice solicitudes autenticadas a la API del sitio."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CONTENT_SECURITY_POLICY_DESC="Comprueba si Content Security Policy (CSP) está configurada mediante el plugin HTTP Headers. CSP previene los ataques XSS (cross-site scripting) al restringir qué recursos pueden cargarse."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_X_FRAME_OPTIONS_DESC="Comprueba si la cabecera X-Frame-Options está configurada. Esta cabecera impide que el sitio sea incrustado en iframes de dominios externos, protegiéndolo contra ataques de clickjacking."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_HTTPS_REDIRECT_DESC="Comprueba si las solicitudes HTTP son redirigidas automáticamente a HTTPS. Sin una redirección, los usuarios que accedan al sitio por HTTP no se beneficiarán del cifrado SSL."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ADMIN_USERNAME_DESC="Comprueba si alguna cuenta de superadministrador usa un nombre de usuario común como admin o administrator. Los nombres de usuario predecibles simplifican los ataques de fuerza bruta automatizados contra el formulario de acceso."
; USERS
PLG_HEALTHCHECKER_CORE_CHECK_USERS_SUPER_ADMIN_COUNT_DESC="Comprueba el número de cuentas de superadministrador activas. Solo las cuentas estrictamente necesarias deben tener este privilegio para reducir la superficie de ataque del sitio."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_INACTIVE_USERS_DESC="Identifica las cuentas que no han iniciado sesión durante un período prolongado. Las cuentas inactivas representan un riesgo de seguridad, ya que pueden tener contraseñas débiles y no ser monitoreadas."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_BLOCKED_USERS_DESC="Informa sobre el número de cuentas de usuario bloqueadas. Revisar y eliminar periódicamente las cuentas bloqueadas antiguas ayuda a mantener una base de datos de usuarios limpia y manejable."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_DUPLICATE_EMAILS_DESC="Detecta cuentas de usuario que comparten la misma dirección de correo electrónico. Los correos duplicados pueden causar problemas en la recuperación de contraseñas, notificaciones e identificación de usuarios."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_REGISTRATION_DESC="Comprueba si el registro público de usuarios está habilitado. Si el registro no es necesario, deshabilitarlo reduce el riesgo de cuentas de spam e intentos de acceso no autorizados."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_DEFAULT_USER_GROUP_DESC="Comprueba qué grupo de usuarios se asigna por defecto a los nuevos registros. Asignar Administrador o Superusuarios como grupo predeterminado es una configuración de seguridad crítica incorrecta."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_GROUPS_DESC="Informa sobre el número de grupos de usuarios definidos. Un número excesivo de grupos puede indicar configuraciones de control de acceso no utilizadas o redundantes que deben consolidarse."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_PASSWORD_EXPIRY_DESC="Comprueba qué porcentaje de usuarios activos no han cambiado su contraseña en más de un año. Las contraseñas obsoletas aumentan el riesgo de compromiso, especialmente tras una filtración de datos."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_LAST_LOGIN_DESC="Identifica las cuentas de usuario activas que nunca han iniciado sesión. Pueden ser cuentas de prueba, registros incompletos o perfiles abandonados que deben revisarse o eliminarse."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_ADMIN_EMAIL_DESC="Verifica que todas las cuentas de superadministrador tengan direcciones de correo electrónico válidas. Los correos inválidos impiden que lleguen los correos de restablecimiento de contraseña y las notificaciones importantes del sistema."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_NOTES_DESC="Informa sobre el número de notas de usuario configuradas en el sistema. Las notas de usuario son registros informativos adjuntos a las cuentas y no indican un problema de estado."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_FIELDS_DESC="Informa sobre el número de campos de perfil de usuario personalizados configurados. Los campos personalizados amplían el formulario de registro de usuarios y permiten recopilar datos adicionales."
; EXTENSIONS
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_CORE_VERSION_DESC="Comprueba si la versión de Joomla! instalada es la más reciente disponible. Ejecutar una versión desactualizada puede exponer el sitio a vulnerabilidades de seguridad conocidas que ya han sido corregidas."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_UPDATE_CHANNEL_DESC="Comprueba qué canal de actualización está configurado en Joomla! Los sitios en producción siempre deben usar el canal Stable para evitar recibir versiones preliminares o de prueba como actualizaciones."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_UPDATE_STABILITY_DESC="Comprueba el nivel de estabilidad mínimo configurado para las actualizaciones de Joomla! Configurarlo en cualquier valor distinto de Stable puede ofrecer versiones preliminares como actualizaciones, no recomendadas para producción."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_DISABLED_EXTENSIONS_DESC="Informa sobre el número de extensiones instaladas que están actualmente deshabilitadas. Las extensiones deshabilitadas siguen ocupando espacio en la base de datos; se recomienda desinstalar las que ya no se necesiten."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_DISCOVER_DESC="Comprueba si hay archivos de extensiones en el sistema de archivos que no han sido instalados a través del gestor de extensiones de Joomla! Las extensiones no descubiertas no recibirán actualizaciones y pueden causar conflictos."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_UPDATE_SITES_DESC="Comprueba cuántos sitios de actualización de extensiones están habilitados. Los sitios de actualización deshabilitados impiden que las extensiones comprueben la disponibilidad de actualizaciones, incluidos los parches de seguridad críticos."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_MISSING_UPDATES_DESC="Comprueba si alguna extensión instalada tiene actualizaciones disponibles. Ejecutar extensiones desactualizadas es una de las principales causas de compromiso del sitio, especialmente cuando hay parches de seguridad pendientes."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_LANGUAGE_PACKS_DESC="Informa sobre el número de paquetes de idioma del sitio y de administración instalados. Ayuda a verificar que todos los idiomas necesarios estén instalados y disponibles correctamente."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_OVERRIDES_DESC="Comprueba si hay sobrescrituras de plantilla que puedan necesitar actualización tras una actualización de Joomla! o de una extensión. Las sobrescrituras desactualizadas pueden causar errores de visualización o introducir vulnerabilidades de seguridad."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_PLUGIN_ORDER_DESC="Comprueba el orden de ejecución de los plugins del sistema en busca de conflictos conocidos. Un orden de plugins incorrecto puede causar problemas funcionales, especialmente con las URL SEF y la caché de página."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_MODULE_POSITIONS_DESC="Verifica que todos los módulos publicados estén asignados a posiciones definidas por la plantilla activa. Los módulos asignados a posiciones inexistentes simplemente no se mostrarán en el sitio."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_TEMPLATE_DESC="Verifica la integridad de las plantillas activas del sitio y del administrador. Un directorio de plantilla o un manifiesto roto o faltante puede hacer que el sitio o su panel de administración sea inaccesible."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_CACHE_PLUGIN_DESC="Comprueba si el plugin Sistema - Caché de página está habilitado y si la caché del sistema está activa. La caché de página mejora significativamente los tiempos de respuesta para los visitantes no autenticados."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_SEARCH_PLUGINS_DESC="Comprueba cuántos plugins de contenido de Búsqueda inteligente están habilitados y si el índice contiene elementos. Un índice vacío significa que la Búsqueda inteligente no devolverá resultados independientemente de las búsquedas realizadas."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_SEARCH_FILTERS_DESC="Comprueba si los filtros de Búsqueda inteligente referenciados por elementos de menú tienen mapas de contenido configurados. Los filtros sin mapas de contenido siempre devuelven resultados vacíos, dejándolos sin función."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_FIELDS_SEARCH_INDEX_DESC="Comprueba si los campos personalizados publicados tienen habilitada la indexación de Búsqueda inteligente. Sin indexación, los valores de los campos personalizados no aparecerán en los resultados de Búsqueda inteligente."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_UNUSED_MODULES_DESC="Identifica los módulos publicados sin asignación de menú que no se cargan mediante la etiqueta loadmodule. Estos módulos se ejecutan en cada carga de página de forma innecesaria, consumiendo recursos del servidor."
; PERFORMANCE
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_SYSTEM_CACHE_DESC="Comprueba si la caché global del sistema de Joomla! está habilitada y qué manejador de caché se usa. La caché del sistema reduce las consultas a la base de datos y mejora los tiempos de respuesta en todo el sitio."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_GZIP_COMPRESSION_DESC="Comprueba si la compresión Gzip está habilitada. Gzip reduce el tamaño de las respuestas HTML, CSS y JavaScript enviadas al navegador, disminuyendo los tiempos de carga de página."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_SMART_SEARCH_INDEX_DESC="Comprueba si el índice de Búsqueda inteligente está poblado cuando el componente está habilitado. Un índice vacío significa que la Búsqueda inteligente no devolverá resultados, dejándola completamente sin función."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_PAGE_CACHE_DESC="Comprueba si el plugin Sistema - Caché de página está activo y correctamente configurado. La caché de página sirve HTML pre-renderizado a los visitantes no autenticados, reduciendo significativamente la carga del servidor."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_LAZY_LOAD_DESC="Comprueba si la carga diferida de imágenes está habilitada. La carga diferida pospone la carga de imágenes fuera de la pantalla, mejorando la velocidad de carga inicial y las puntuaciones de Core Web Vitals."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_CSS_MINIFY_DESC="Comprueba si la minificación de CSS está habilitada. La minificación elimina espacios en blanco y comentarios de los archivos CSS, reduciendo su tamaño y mejorando el rendimiento de carga de página."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_JS_MINIFY_DESC="Comprueba si la minificación de JavaScript está habilitada. La minificación reduce el tamaño de los archivos JavaScript, disminuyendo los tiempos de descarga y mejorando el rendimiento general de página."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_IMAGE_OPTIMIZATION_DESC="Analiza el directorio de imágenes en busca de archivos mayores de 500 KB. Las imágenes sobredimensionadas son una de las causas más comunes de tiempos de carga lentos y puntuaciones bajas en Core Web Vitals."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_REDIRECTS_DESC="Detecta cadenas de redirección y bucles en el Gestor de redirecciones. Cada redirección en una cadena añade latencia; los bucles causan redirecciones infinitas que hacen las páginas permanentemente inaccesibles."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_BROWSER_CACHE_DESC="Comprueba si hay reglas de caché del navegador definidas en .htaccess para recursos estáticos. La caché del navegador permite a los visitantes recurrentes cargar páginas más rápido al reutilizar recursos descargados anteriormente."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_DATABASE_QUERY_CACHE_DESC="Comprueba el estado de la caché de consultas de MySQL. En MySQL 8.0 y posterior la caché de consultas fue eliminada; en su lugar debe usarse caché a nivel de aplicación."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_MEDIA_MANAGER_THUMBNAILS_DESC="Comprueba si la generación de miniaturas está habilitada para todos los directorios multimedia configurados. Las miniaturas agilizan la navegación por grandes bibliotecas de imágenes en el Gestor multimedia."
; SEO
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SITE_META_DESCRIPTION_DESC="Comprueba si hay una meta description global configurada. La meta description se muestra en los fragmentos de resultados de los motores de búsqueda e influye en la tasa de clics hacia el sitio."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SEF_URLS_DESC="Comprueba si las URL amigables para motores de búsqueda (SEF) y la reescritura de URL están habilitadas. Las URL SEF mejoran la indexación en motores de búsqueda y son más legibles y memorables para los usuarios."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_ROBOTS_FILE_DESC="Comprueba si hay un archivo robots.txt presente y correctamente configurado. El archivo robots.txt indica a los rastreadores de los motores de búsqueda qué áreas del sitio indexar o evitar."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SITEMAP_DESC="Comprueba si hay un mapa del sitio XML presente. Un mapa del sitio XML ayuda a los motores de búsqueda a descubrir e indexar todas las páginas importantes, especialmente las que no están enlazadas desde la navegación principal."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_CANONICAL_URL_DESC="Comprueba si las URL SEF y el plugin Sistema SEF están activos. Son prerrequisitos para la generación correcta de URL canónicas, que previenen los problemas de contenido duplicado en los motores de búsqueda."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_OPEN_GRAPH_DESC="Comprueba si hay un plugin de Open Graph habilitado. Las meta etiquetas Open Graph controlan cómo se muestra el contenido al compartirlo en redes sociales como Facebook y LinkedIn."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_TWITTER_CARDS_DESC="Comprueba si las meta etiquetas esenciales de X/Twitter Card están presentes en la portada del sitio. Las Twitter Cards controlan la imagen de vista previa, el título y la descripción que se muestran al compartir el sitio en X."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_FACEBOOK_OPEN_GRAPH_DESC="Verifica que todas las etiquetas Facebook Open Graph necesarias estén presentes en la portada. Estas etiquetas controlan la imagen, el título y la descripción que se muestran al compartir el sitio en Facebook."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_STRUCTURED_DATA_DESC="Comprueba si hay algún plugin que proporcione datos estructurados de Schema.org habilitado. Los datos estructurados ayudan a los motores de búsqueda a entender el contenido y pueden habilitar resultados enriquecidos como valoraciones y FAQs en los fragmentos de búsqueda."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_BROKEN_LINKS_DESC="Comprueba el Gestor de redirecciones en busca de errores 404 no gestionados. Los enlaces rotos perjudican la experiencia del usuario y pueden afectar negativamente al posicionamiento en los motores de búsqueda con el tiempo."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_META_KEYWORDS_DESC="Comprueba si hay meta keywords configuradas. Los principales motores de búsqueda ignoran las meta keywords desde 2009; conviene centrarse en contenido de calidad y meta descriptions bien redactadas."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_ALT_TEXT_DESC="Analiza los artículos publicados en busca de imágenes sin texto alternativo. El texto alternativo es esencial para la accesibilidad web (WCAG) y ayuda a los motores de búsqueda a entender el contenido de las imágenes para su indexación."
; CONTENT
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_ORPHANED_ARTICLES_DESC="Identifica los artículos publicados que no están enlazados desde ningún elemento de menú. Estos artículos pueden ser inaccesibles para los visitantes a menos que estén enlazados directamente desde otro contenido o módulos."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_UNCATEGORIZED_CONTENT_DESC="Informa sobre los artículos asignados a la categoría predeterminada Sin categoría. Organizar el contenido en categorías adecuadas mejora la estructura del sitio, la navegación y la indexación en motores de búsqueda."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_DRAFT_ARTICLES_DESC="Informa sobre los artículos no publicados que pueden ser borradores en progreso. Los borradores antiguos que ya no se necesitan deben eliminarse para mantener la base de datos de contenido limpia y organizada."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_TRASHED_CONTENT_DESC="Informa sobre los artículos que se encuentran actualmente en la papelera de Joomla! Los artículos eliminados permanecen en la base de datos hasta que se borran definitivamente; vaciar la papelera periódicamente mantiene la base de datos limpia."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_EMPTY_ARTICLES_DESC="Identifica los artículos publicados con contenido muy corto o vacío. Pueden ser artículos de marcador de posición que se publicaron accidentalmente u olvidaron durante el desarrollo del sitio."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_SCHEDULED_CONTENT_DESC="Informa sobre los artículos configurados para publicación futura. Es útil para confirmar que el contenido programado está correctamente configurado y se publicará en la fecha y hora previstas."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_EXPIRED_CONTENT_DESC="Identifica los artículos publicados que han superado su fecha de vencimiento configurada pero siguen siendo visibles. El contenido vencido debe revisarse, actualizarse con una nueva fecha de vencimiento o despublicarse."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_ARCHIVED_CONTENT_DESC="Informa sobre el número de artículos archivados. El contenido archivado sigue siendo accesible mediante URL directa pero se excluye de los listados de artículos estándar. Se recomienda una revisión periódica."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_MENU_ORPHANS_DESC="Detecta elementos de menú que apuntan a artículos que ya no existen en la base de datos. Estos elementos de menú rotos provocan errores 404 a cualquier visitante que haga clic en ellos."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_CATEGORY_DEPTH_DESC="Comprueba si hay categorías anidadas a más de 5 niveles de profundidad. Las categorías muy anidadas crean URL largas, complican la navegación y pueden causar problemas de renderizado con algunas extensiones."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_UNPUBLISHED_CATEGORY_ARTICLES_DESC="Identifica los artículos publicados que pertenecen a categorías padre no publicadas. Estos artículos son efectivamente invisibles para los visitantes aunque estén configurados individualmente como publicados."