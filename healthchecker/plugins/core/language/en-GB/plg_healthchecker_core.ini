; ── Inline help descriptions ──────────────────────────────────────
; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_CORE_EXPORT_VISIBILITY_DESC="Controls whether this check appears in exported reports. 'Always export' includes the result regardless of status. 'Issues only' includes it only when Critical or Warning. 'Never export' excludes it from all exports."

; SYSTEM
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_VERSION_DESC="Verifies that the PHP version meets Joomla 5+ requirements. An outdated PHP version may cause compatibility issues and security vulnerabilities."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_EOL_DESC="Checks whether the installed PHP version is within its active support lifecycle. End-of-life PHP versions no longer receive security patches."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PHP_SAPI_DESC="Identifies the PHP Server API (SAPI) in use. PHP-FPM is recommended for better performance and isolation in production environments."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MEMORY_LIMIT_DESC="Verifies that PHP's memory_limit is sufficient for Joomla. A low memory limit can cause errors during extension installation or complex page rendering."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_EXECUTION_TIME_DESC="Checks the maximum time in seconds a PHP script is allowed to run. A value too low can cause timeouts during backups or large data imports."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_INPUT_TIME_DESC="Checks the maximum time PHP waits to receive input data. A low value can cause issues when uploading large files or submitting complex forms."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAX_INPUT_VARS_DESC="Verifies the maximum number of input variables PHP accepts per request. A low value can cause data loss in forms with many fields, such as menus or ACL settings."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_POST_MAX_SIZE_DESC="Checks the maximum size of POST data PHP will accept. This value must be larger than upload_max_filesize to allow file uploads to work correctly."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_UPLOAD_MAX_FILESIZE_DESC="Verifies the maximum file size allowed for uploads. A low value prevents uploading large extension packages, images, or media files."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OUTPUT_BUFFERING_DESC="Checks whether PHP output buffering is enabled. When enabled it can interfere with Joomla header management and cause unexpected output issues."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_JSON_EXTENSION_DESC="Verifies that the JSON PHP extension is loaded. This extension is required by Joomla for processing API responses, configuration files, and data exchange."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SIMPLEXML_EXTENSION_DESC="Verifies that the SimpleXML PHP extension is loaded. Joomla uses SimpleXML to read extension manifests (.xml files) during installation."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_DOM_EXTENSION_DESC="Verifies that the DOM PHP extension is loaded. Required by Joomla for XML processing, HTML manipulation, and various core operations."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_PDO_MYSQL_EXTENSION_DESC="Verifies that the PDO MySQL PHP extension is loaded. This is the database driver Joomla uses to communicate with MySQL and MariaDB."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_GD_OR_IMAGICK_DESC="Checks whether the GD or Imagick image processing extensions are available. At least one is required for image resizing, thumbnail generation, and CAPTCHA rendering."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_ZIP_EXTENSION_DESC="Verifies that the Zip PHP extension is loaded. Required for installing and updating Joomla extensions, which are distributed as .zip files."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MBSTRING_EXTENSION_DESC="Verifies that the Mbstring PHP extension is loaded. Required for correct handling of multibyte characters (UTF-8), essential for multilingual sites."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_INTL_EXTENSION_DESC="Checks whether the Intl PHP extension is loaded. Used by Joomla for locale-aware string operations, date formatting, and number formatting."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_CORE_DIRECTORIES_DESC="Verifies that critical Joomla directories such as /tmp, /logs, and /cache exist and are accessible. Missing directories can cause Joomla to malfunction."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_CURL_EXTENSION_DESC="Checks whether the cURL PHP extension is loaded. Used for remote HTTP requests, including extension update checks and external API integrations."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OPENSSL_EXTENSION_DESC="Verifies that the OpenSSL PHP extension is loaded. Required for HTTPS connections, encrypted email via SMTP TLS/SSL, and cryptographic operations."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_FILEINFO_EXTENSION_DESC="Checks whether the Fileinfo PHP extension is loaded. Used for MIME type detection when uploading files through the Media Manager."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_DISK_SPACE_DESC="Checks the available disk space on the server. Critically low disk space can prevent Joomla from writing temporary files, logs, or cached content."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_TEMP_DIRECTORY_DESC="Verifies that Joomla's temporary directory exists and is writable. The temp directory is used during extension installations and core updates."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SERVER_TIME_DESC="Checks that the server clock is synchronized with an external time source. A drifted clock can cause issues with session expiry, scheduled tasks, and SSL certificates."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OPCACHE_DESC="Checks whether PHP OPcache is enabled and healthy. OPcache significantly improves PHP performance by storing precompiled script bytecode in memory."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_REALPATH_CACHE_DESC="Verifies that PHP's realpath cache is appropriately sized. An undersized cache forces PHP to resolve file paths on every request, reducing performance."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_OVERDUE_TASKS_DESC="Checks for scheduled tasks that have passed their execution time without running. Overdue tasks may indicate a misconfigured or stopped task scheduler (cron)."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_FAILED_TASKS_DESC="Checks for scheduled tasks that have failed during execution. Failed tasks should be reviewed in the task scheduler to identify and resolve the underlying cause."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_SESSION_SAVE_PATH_DESC="Verifies that the PHP session save path exists and is writable. An inaccessible session path prevents users from logging in or maintaining their session."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_MAIL_FUNCTION_DESC="Checks whether the configured mail method (PHP mail, SMTP, or Sendmail) is available and functional. A broken mail configuration prevents Joomla from sending any emails."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_EXIF_EXTENSION_DESC="Checks whether the EXIF PHP extension is loaded. Used to read metadata embedded in image files, such as camera information, GPS coordinates, and orientation."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_IMAGICK_VERSION_DESC="Checks the version of the Imagick extension if installed. An outdated Imagick version may have security vulnerabilities or lack support for modern image formats."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_LOG_FILE_SIZE_DESC="Checks the total size of Joomla's log directory. An excessively large log directory may indicate errors generating excessive log entries or a need for log rotation."
PLG_HEALTHCHECKER_CORE_CHECK_SYSTEM_APACHE_MODULES_DESC="Checks whether required Apache modules such as mod_rewrite and mod_expires are available. Missing modules can prevent SEF URLs, browser caching, and other features from working."
; DATABASE
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_CONNECTION_DESC="Verifies that Joomla can successfully connect to its configured database. A failed connection makes the entire site inaccessible."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SERVER_VERSION_DESC="Checks that the database server version meets Joomla 5+ requirements. MySQL 8.0 or MariaDB 10.4 or later are recommended for full compatibility."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_USER_PRIVILEGES_DESC="Verifies that the database user has all necessary privileges such as SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, and ALTER. Missing privileges can cause extension installations to fail."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_CONNECTION_CHARSET_DESC="Checks that the database connection uses the utf8mb4 character set. This ensures full Unicode support including emojis and special characters from all languages."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_ENGINE_DESC="Verifies that all Joomla tables use the InnoDB storage engine. InnoDB supports transactions, foreign keys, and row-level locking, essential for data integrity."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_CHARSET_DESC="Checks that all Joomla tables use utf8mb4 collation. Inconsistent collation can cause character encoding issues and comparison errors in queries."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_STATUS_DESC="Checks the integrity of all Joomla database tables. Corrupted tables can cause data loss, query errors, and site instability."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_AUTO_INCREMENT_DESC="Checks that auto-increment counters in key tables have sufficient headroom before reaching their maximum value. Exhausted counters prevent new records from being created."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_ORPHANED_TABLES_DESC="Detects database tables with the site prefix that are not registered as belonging to any installed extension. These may be leftovers from extensions that were not cleanly uninstalled."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SQL_MODE_DESC="Checks the SQL mode configured on the database server. Certain strict modes such as ONLY_FULL_GROUP_BY can cause compatibility issues with some Joomla extensions."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_MAX_PACKET_DESC="Checks the max_allowed_packet database setting. A low value can prevent large content from being saved, causing silent data truncation or query errors."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_WAIT_TIMEOUT_DESC="Checks the database wait_timeout setting. A very low value can cause connection timeouts during long operations; a very high value wastes server resources."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TABLE_PREFIX_DESC="Verifies that a custom database table prefix is configured. Using the default 'jos_' prefix is a minor security risk as it is predictable in SQL injection attempts."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_INDEX_USAGE_DESC="Checks that all Joomla tables have primary keys and indexes defined. Tables without indexes suffer severe performance degradation as data grows."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SIZE_DESC="Reports the total size of the database. A rapidly growing database may require archiving old content or optimizing table storage."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_SLOW_QUERY_DESC="Checks whether the MySQL slow query log is enabled. While useful for debugging, it should be disabled in production as it adds overhead to every database query."
PLG_HEALTHCHECKER_CORE_CHECK_DATABASE_TRANSACTION_ISOLATION_DESC="Checks the database transaction isolation level. The REPEATABLE-READ level is recommended for most Joomla installations as it balances consistency and performance."
; SECURITY
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_DEBUG_MODE_DESC="Checks whether Joomla debug mode is enabled. Debug mode must always be disabled in production as it exposes detailed error messages and system information to visitors."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ERROR_REPORTING_DESC="Checks the PHP error reporting level configured in Joomla. Maximum error reporting should only be used during development; production sites should use None or Simple."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_FORCE_SSL_DESC="Checks whether Joomla is configured to force HTTPS connections. Forcing SSL ensures that all traffic including login credentials is encrypted in transit."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_SESSION_HANDLER_DESC="Checks the session storage method configured in Joomla. Database sessions are recommended on shared hosting as they are more secure than filesystem sessions."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_DEFAULT_SECRET_DESC="Verifies that Joomla's secret key is set, unique, and of sufficient length. The secret key is used for cryptographic operations; a weak or default key is a critical security risk."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_HTACCESS_PROTECTION_DESC="Checks whether an .htaccess file is present and configured on Apache servers. A missing or empty .htaccess file disables URL rewriting and important security protections."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_INDEX_FILE_DESC="Checks for placeholder index.html or index.php files in the site root. These files can be served to visitors or indexed by search engines unintentionally."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CONFIGURATION_PHP_PERMISSIONS_DESC="Verifies the file permissions of configuration.php. World-readable or world-writable permissions expose database credentials and sensitive settings to unauthorized access."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_TWO_FACTOR_AUTH_DESC="Checks whether Multi-Factor Authentication plugins are enabled and configured for Super Admin accounts. MFA significantly reduces the risk of unauthorized administrator access."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_SESSION_LIFETIME_DESC="Checks the configured session lifetime in minutes. An excessively long session increases the risk of session hijacking; a very short one causes frequent logouts."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ACTION_LOGS_ENABLED_DESC="Checks whether the System - Action Logs plugin is enabled. Action logs record administrator activity, essential for security auditing and tracing unauthorized changes."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_MAILER_SECURITY_DESC="Checks the security configuration of Joomla's email system. SMTP with TLS or SSL encryption is recommended to prevent email credentials from being transmitted in plain text."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_RECAPTCHA_DESC="Checks whether a CAPTCHA plugin is enabled and set as default. CAPTCHA is essential for preventing automated spam submissions through forms and registration pages."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_API_AUTH_DESC="Checks which API authentication plugins are enabled. Without an authentication plugin, the Joomla Web Services API is inaccessible to all clients including authorized ones."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_PRIVACY_DASHBOARD_DESC="Checks whether the Privacy component is enabled and whether there are pending privacy requests. The Privacy component is required for GDPR compliance features."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ADMIN_PATH_DESC="Checks whether the administrator path has been customized from the default /administrator. A predictable admin path makes it easier for automated bots to target the login page."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_PASSWORD_POLICY_DESC="Checks the minimum password length and complexity requirements. A weak password policy increases the risk of account compromise through brute force or dictionary attacks."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_BRUTE_FORCE_PROTECTION_DESC="Checks whether brute force protection is in place for the login form. Without protection, automated tools can attempt unlimited login combinations against the site."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CORS_DESC="Checks the Cross-Origin Resource Sharing (CORS) configuration. A wildcard CORS policy allows any external site to make authenticated requests to your site's API."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_CONTENT_SECURITY_POLICY_DESC="Checks whether Content Security Policy (CSP) is configured via the HTTP Headers plugin. CSP prevents cross-site scripting (XSS) attacks by restricting which resources can be loaded."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_X_FRAME_OPTIONS_DESC="Checks whether the X-Frame-Options header is configured. This header prevents the site from being embedded in iframes on external domains, protecting against clickjacking attacks."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_HTTPS_REDIRECT_DESC="Checks whether HTTP requests are automatically redirected to HTTPS. Without a redirect, users who access the site over HTTP will not benefit from SSL encryption."
PLG_HEALTHCHECKER_CORE_CHECK_SECURITY_ADMIN_USERNAME_DESC="Checks whether any Super Admin account uses a common username such as admin or administrator. Predictable usernames simplify automated brute force attacks against the login form."
; USERS
PLG_HEALTHCHECKER_CORE_CHECK_USERS_SUPER_ADMIN_COUNT_DESC="Checks the number of active Super Admin accounts. Only the minimum necessary accounts should hold this privilege to reduce the site's attack surface."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_INACTIVE_USERS_DESC="Identifies accounts that have not logged in for an extended period. Inactive accounts represent a security risk as they may have weak passwords and go unmonitored."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_BLOCKED_USERS_DESC="Reports the number of blocked user accounts. Periodically reviewing and removing old blocked accounts helps maintain a clean and manageable user database."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_DUPLICATE_EMAILS_DESC="Detects user accounts that share the same email address. Duplicate emails can cause issues with password recovery, notifications, and user identification."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_REGISTRATION_DESC="Checks whether public user registration is enabled. If registration is not needed, disabling it reduces the risk of spam accounts and unauthorized access attempts."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_DEFAULT_USER_GROUP_DESC="Checks which user group is assigned to new registrations by default. Assigning Administrator or Super Users as the default group is a critical security misconfiguration."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_GROUPS_DESC="Reports the number of user groups defined. An excessive number of groups may indicate unused or redundant access control configurations that should be consolidated."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_PASSWORD_EXPIRY_DESC="Checks what percentage of active users have not changed their password in over a year. Stale passwords increase the risk of compromise, especially after a data breach."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_LAST_LOGIN_DESC="Identifies active user accounts that have never logged in. These accounts may be test accounts, incomplete registrations, or abandoned profiles that should be reviewed or removed."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_ADMIN_EMAIL_DESC="Verifies that all Super Admin accounts have valid, non-placeholder email addresses. Invalid admin emails prevent password reset emails and important system notifications from being delivered."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_NOTES_DESC="Reports the number of user notes configured in the system. User notes are informational records attached to user accounts and do not indicate a health issue."
PLG_HEALTHCHECKER_CORE_CHECK_USERS_USER_FIELDS_DESC="Reports the number of custom user profile fields configured. Custom fields extend the user registration form and can collect additional data from users."
; EXTENSIONS
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_CORE_VERSION_DESC="Checks whether the installed Joomla version is the latest available. Running an outdated version may expose the site to known security vulnerabilities that have been patched."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_UPDATE_CHANNEL_DESC="Checks which update channel Joomla is configured to use. Production sites should always use the Stable channel to avoid receiving pre-release or test versions as updates."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_JOOMLA_UPDATE_STABILITY_DESC="Checks the minimum stability level set for Joomla updates. Setting this to anything other than Stable may offer pre-release versions as updates, which are not recommended for production."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_DISABLED_EXTENSIONS_DESC="Reports the number of installed extensions that are currently disabled. Disabled extensions still occupy database space; consider uninstalling those that are no longer needed."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_DISCOVER_DESC="Checks for extension files on the filesystem that have not been installed through Joomla's extension manager. Undiscovered extensions will not receive updates and may cause conflicts."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_UPDATE_SITES_DESC="Checks how many extension update sites are enabled. Disabled update sites prevent extensions from checking for available updates, including critical security patches."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_MISSING_UPDATES_DESC="Checks whether any installed extensions have available updates. Running outdated extensions is a leading cause of site compromise, especially when security patches are pending."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_LANGUAGE_PACKS_DESC="Reports the number of site and administrator language packs installed. Helps verify that all required languages are properly installed and available."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_OVERRIDES_DESC="Checks for template overrides that may need updating after a Joomla or extension update. Outdated overrides can cause display errors or introduce security vulnerabilities."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_PLUGIN_ORDER_DESC="Checks the execution order of system plugins for known ordering conflicts. Incorrect plugin order can cause functional issues, particularly with SEF URLs and page caching."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_MODULE_POSITIONS_DESC="Verifies that all published modules are assigned to positions defined by the active template. Modules assigned to non-existent positions will simply not appear on the site."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_TEMPLATE_DESC="Verifies the integrity of the active site and administrator templates. A broken or missing template directory or manifest can make the site or its backend inaccessible."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_CACHE_PLUGIN_DESC="Checks whether the System - Page Cache plugin is enabled and whether system caching is active. Page caching significantly improves response times for guest users."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_SEARCH_PLUGINS_DESC="Checks how many Smart Search content plugins are enabled and whether the index contains items. An empty index means Smart Search will return no results regardless of search queries."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_SEARCH_FILTERS_DESC="Checks whether Smart Search filters referenced by menu items have content maps configured. Filters without content maps always return empty search results, making them non-functional."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_FIELDS_SEARCH_INDEX_DESC="Checks whether published custom fields have Smart Search indexing enabled. Without indexing, custom field values will not appear in Smart Search results."
PLG_HEALTHCHECKER_CORE_CHECK_EXTENSIONS_UNUSED_MODULES_DESC="Identifies published modules with no menu assignment that are not loaded via the loadmodule tag. These modules execute on every page load unnecessarily, consuming server resources."
; PERFORMANCE
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_SYSTEM_CACHE_DESC="Checks whether Joomla's global system cache is enabled and which cache handler is in use. System caching reduces database queries and improves response times across the site."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_GZIP_COMPRESSION_DESC="Checks whether Gzip compression is enabled. Gzip reduces the size of HTML, CSS, and JavaScript responses sent to the browser, decreasing page load times."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_SMART_SEARCH_INDEX_DESC="Checks whether the Smart Search index is populated when the component is enabled. An empty index means Smart Search will return no results, making it completely non-functional."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_PAGE_CACHE_DESC="Checks whether the System - Page Cache plugin is active and properly configured. Page caching serves pre-rendered HTML to guest users, significantly reducing server load."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_LAZY_LOAD_DESC="Checks whether lazy loading for images is enabled. Lazy loading defers off-screen image loading, improving initial page load speed and Core Web Vitals scores."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_CSS_MINIFY_DESC="Checks whether CSS minification is enabled. Minification removes whitespace and comments from CSS files, reducing their size and improving page load performance."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_JS_MINIFY_DESC="Checks whether JavaScript minification is enabled. Minification reduces the size of JavaScript files, decreasing download times and improving overall page performance."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_IMAGE_OPTIMIZATION_DESC="Scans the images directory for files larger than 500 KB. Oversized images are one of the most common causes of slow page load times and poor Core Web Vitals scores."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_REDIRECTS_DESC="Detects redirect chains and loops in the Redirect Manager. Each redirect in a chain adds latency; loops cause infinite redirects that make pages permanently inaccessible."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_BROWSER_CACHE_DESC="Checks whether browser caching rules are defined in .htaccess for static assets. Browser caching allows returning visitors to load pages faster by reusing previously downloaded resources."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_DATABASE_QUERY_CACHE_DESC="Checks the status of the MySQL query cache. On MySQL 8.0 and later the query cache was removed; application-level caching should be used instead."
PLG_HEALTHCHECKER_CORE_CHECK_PERFORMANCE_MEDIA_MANAGER_THUMBNAILS_DESC="Checks whether thumbnail generation is enabled for all configured media directories. Thumbnails speed up browsing large image libraries in the Media Manager."
; SEO
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SITE_META_DESCRIPTION_DESC="Checks whether a global meta description is set. The meta description is displayed in search engine result snippets and influences the click-through rate to the site."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SEF_URLS_DESC="Checks whether Search Engine Friendly URLs and URL rewriting are enabled. SEF URLs improve search engine indexing and are more readable and memorable for users."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_ROBOTS_FILE_DESC="Checks whether a robots.txt file is present and correctly configured. The robots.txt file instructs search engine crawlers which areas of the site to index or avoid."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_SITEMAP_DESC="Checks for the presence of an XML sitemap. An XML sitemap helps search engines discover and index all important pages, especially those not linked from the main navigation."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_CANONICAL_URL_DESC="Checks whether SEF URLs and the System SEF plugin are active. These are prerequisites for correct canonical URL generation, which prevents duplicate content issues in search engines."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_OPEN_GRAPH_DESC="Checks whether an Open Graph plugin is enabled. Open Graph meta tags control how content is displayed when shared on social networks such as Facebook and LinkedIn."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_TWITTER_CARDS_DESC="Checks whether essential X/Twitter Card meta tags are present on the homepage. Twitter Cards control the preview image, title, and description shown when the site is shared on X."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_FACEBOOK_OPEN_GRAPH_DESC="Verifies that all required Facebook Open Graph tags are present on the homepage. These tags control the image, title, and description displayed when the site is shared on Facebook."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_STRUCTURED_DATA_DESC="Checks whether a plugin providing Schema.org structured data is enabled. Structured data helps search engines understand content and can enable rich results such as star ratings and FAQs in search snippets."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_BROKEN_LINKS_DESC="Checks the Redirect Manager for unhandled 404 errors. Broken links harm user experience and can negatively affect search engine rankings over time."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_META_KEYWORDS_DESC="Checks whether meta keywords are configured. Major search engines have ignored meta keywords since 2009; focus on quality content and well-written meta descriptions instead."
PLG_HEALTHCHECKER_CORE_CHECK_SEO_ALT_TEXT_DESC="Scans published articles for images that are missing alt text. Alt text is essential for web accessibility (WCAG) and helps search engines understand image content for indexing."
; CONTENT
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_ORPHANED_ARTICLES_DESC="Identifies published articles that are not linked from any menu item. These articles may be inaccessible to visitors unless linked directly from other content or modules."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_UNCATEGORIZED_CONTENT_DESC="Reports articles assigned to the default Uncategorized category. Organizing content in proper categories improves site structure, navigation, and search engine indexing."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_DRAFT_ARTICLES_DESC="Reports unpublished articles that may be drafts in progress. Old drafts that are no longer needed should be deleted to keep the content database clean and organized."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_TRASHED_CONTENT_DESC="Reports articles currently in the Joomla trash. Trashed articles remain in the database until permanently deleted; regularly emptying the trash keeps the database clean."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_EMPTY_ARTICLES_DESC="Identifies published articles with very short or empty content. These may be placeholder articles that were accidentally published or forgotten during site development."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_SCHEDULED_CONTENT_DESC="Reports articles configured for future publication. Useful for confirming that scheduled content is properly set up and will be published at the intended date and time."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_EXPIRED_CONTENT_DESC="Identifies published articles that have passed their configured expiry date but remain visible. Expired content should be reviewed, updated with a new expiry date, or unpublished."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_ARCHIVED_CONTENT_DESC="Reports the number of archived articles. Archived content remains accessible via direct URL but is excluded from standard article listings. Periodic review is recommended."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_MENU_ORPHANS_DESC="Detects menu items that point to articles that no longer exist in the database. These broken menu items cause 404 errors for any visitor who clicks on them."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_CATEGORY_DEPTH_DESC="Checks for categories nested more than 5 levels deep. Deeply nested categories create long URLs, complicate navigation, and may cause rendering issues with some extensions."
PLG_HEALTHCHECKER_CORE_CHECK_CONTENT_UNPUBLISHED_CATEGORY_ARTICLES_DESC="Identifies published articles that belong to unpublished parent categories. These articles are effectively invisible to visitors even though they are individually set to published."