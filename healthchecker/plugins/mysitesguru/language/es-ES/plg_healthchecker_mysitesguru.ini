; Export field — shared description used on every export dropdown
PLG_HEALTHCHECKER_MYSITESGURU_EXPORT_VISIBILITY_DESC="Controla si esta comprobación aparece en los informes exportados. 'Exportar siempre' incluye el resultado sin importar su estado. 'Solo problemas' lo incluye únicamente cuando es Crítico o Advertencia. 'No exportar' lo excluye de todas las exportaciones."

PLG_HEALTHCHECKER_MYSITESGURU_CHECK_MYSITESGURU_CONNECTION_DESC="Comprueba si este sitio Joomla! está conectado a una cuenta de monitoreo de mySites.guru. Cuando está conectado, las comprobaciones de estado se ejecutan automáticamente 24/7 con alertas instantáneas al detectar problemas, sin necesidad de visitar este panel manualmente. Si no está conectado, el monitoreo debe iniciarse manualmente desde esta página."
