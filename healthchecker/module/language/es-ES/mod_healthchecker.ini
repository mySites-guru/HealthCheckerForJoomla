MOD_HEALTHCHECKER_ENABLE_CACHE="Habilitar caché"
MOD_HEALTHCHECKER_ENABLE_CACHE_DESC="Almacena en caché los resultados de la comprobación de estado para mejorar el rendimiento del panel. Cuando está deshabilitado, las comprobaciones se ejecutan en cada carga de página."
MOD_HEALTHCHECKER_ENABLE_CACHE_DESC_GLOBAL="Almacena en caché los resultados de la comprobación de estado para mejorar el rendimiento del panel. Requiere que la caché global de Joomla! esté habilitada (Sistema > Configuración global > Sistema > Caché). Cuando está deshabilitado, las comprobaciones se ejecutan en cada carga de página."
MOD_HEALTHCHECKER_CACHE_DURATION="Duración de la caché (segundos)"
MOD_HEALTHCHECKER_CACHE_DURATION_DESC="Tiempo durante el cual se almacenan en caché los resultados de la comprobación de estado. El valor predeterminado es 900 segundos (15 minutos). Mínimo 60 segundos, máximo 86400 segundos (24 horas)."
MOD_HEALTHCHECKER_CACHE_NOTE="<div class=\"alert alert-info\"><strong>Nota:</strong> El uso de caché requiere que la caché global de Joomla! esté habilitada en Sistema &gt; Configuración global &gt; Sistema &gt; Configuración de caché.</div>"
MOD_HEALTHCHECKER_REFRESH_CACHE="Actualizar resultados"

MOD_HEALTHCHECKER_NO_CHECKS="No se encontraron comprobaciones de estado. Asegúrese de que el plugin Health Checker esté habilitado."

; ── Descripciones de ayuda interna ──────────────────────────────────────────
MOD_HEALTHCHECKER_SHOW_CRITICAL_DESC="Muestra u oculta el indicador de cantidad de elementos Críticos en el widget del panel. Los elementos críticos requieren atención inmediata, ya que indican problemas graves de configuración o riesgos de seguridad."
MOD_HEALTHCHECKER_SHOW_WARNING_DESC="Muestra u oculta el indicador de cantidad de Advertencias en el widget del panel. Las advertencias indican problemas no críticos que conviene revisar y resolver cuando sea posible."
MOD_HEALTHCHECKER_SHOW_GOOD_DESC="Muestra u oculta el indicador de cantidad de elementos Correctos en el widget del panel. La cantidad de correctos confirma cuántas comprobaciones pasaron satisfactoriamente, ofreciendo una visión positiva del estado del sitio."
